<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="60%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#2a1c3a"/>
      <stop offset="55%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#050510"/>
    </radialGradient>
    <radialGradient id="planet" cx="30%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#f7c68a"/>
      <stop offset="45%" stop-color="#c66a3a"/>
      <stop offset="80%" stop-color="#5a2410"/>
      <stop offset="100%" stop-color="#100604"/>
    </radialGradient>
    <radialGradient id="atmosphere" cx="30%" cy="30%" r="90%">
      <stop offset="70%" stop-color="#ffb570" stop-opacity="0"/>
      <stop offset="88%" stop-color="#ffb570" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffb570" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0b090" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e0b090" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e0b090" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>

  <!-- Star field -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="80" cy="120" r="1"/>
    <circle cx="220" cy="80" r="1.3"/>
    <circle cx="380" cy="180" r="0.9"/>
    <circle cx="1440" cy="130" r="1.4"/>
    <circle cx="1520" cy="70" r="1"/>
    <circle cx="140" cy="820" r="1.2"/>
    <circle cx="380" cy="920" r="1"/>
    <circle cx="1420" cy="880" r="1.4"/>
    <circle cx="1500" cy="930" r="1"/>
  </g>

  <!-- Planet with atmosphere and rings -->
  <g transform="translate(1050 500)">
    <ellipse cx="0" cy="0" rx="520" ry="52" fill="url(#ring)" opacity="0.7" transform="rotate(-18)"/>
    <ellipse cx="0" cy="0" rx="440" ry="30" fill="url(#ring)" opacity="0.55" transform="rotate(-18)"/>
    <circle r="255" fill="url(#atmosphere)" filter="url(#glow)"/>
    <circle r="220" fill="url(#planet)"/>
    <!-- Cloud bands -->
    <g opacity="0.35" fill="#f7c68a">
      <ellipse cx="0" cy="-70" rx="200" ry="10"/>
      <ellipse cx="-20" cy="-20" rx="215" ry="8"/>
      <ellipse cx="10" cy="40" rx="210" ry="12"/>
      <ellipse cx="-10" cy="110" rx="180" ry="10"/>
    </g>
    <!-- Terminator shadow -->
    <circle r="220" fill="url(#atmosphere)"/>
    <path d="M -220 0 A 220 220 0 0 0 220 0 A 100 220 0 0 1 -220 0 Z" fill="#050510" opacity="0.55"/>
  </g>

  <!-- Left data panel -->
  <g font-family="'JetBrains Mono', 'Menlo', monospace" fill="#c8ccff">
    <!-- Panel title -->
    <text x="80" y="180" font-size="12" opacity="0.55" letter-spacing="1.5">/ PLANET DETAIL</text>
    <text x="80" y="240" font-family="'Inter', 'Khteka', sans-serif" font-size="52" font-weight="700" fill="#e8e8f0" letter-spacing="-1">HD 209458 b</text>
    <text x="80" y="275" font-size="14" opacity="0.65">HOST · G0V YELLOW DWARF</text>

    <!-- Data table -->
    <g font-size="14" fill="#c8ccff">
      <g transform="translate(80 340)">
        <text opacity="0.55">MASS</text>
        <text x="0" y="26" font-size="22" fill="#e8e8f0">0.69 M♃</text>
      </g>
      <g transform="translate(80 410)">
        <text opacity="0.55">RADIUS</text>
        <text x="0" y="26" font-size="22" fill="#e8e8f0">1.38 R♃</text>
      </g>
      <g transform="translate(80 480)">
        <text opacity="0.55">ORBIT</text>
        <text x="0" y="26" font-size="22" fill="#e8e8f0">3.52 days</text>
      </g>
      <g transform="translate(80 550)">
        <text opacity="0.55">T_EQ</text>
        <text x="0" y="26" font-size="22" fill="#e8e8f0">1449 K</text>
      </g>
      <g transform="translate(80 620)">
        <text opacity="0.55">CLASSIFICATION</text>
        <text x="0" y="26" font-size="22" fill="#f7a870">HOT JUPITER</text>
      </g>
    </g>

    <!-- Habitability bar -->
    <g transform="translate(80 720)">
      <text font-size="12" opacity="0.55" letter-spacing="1">HABITABILITY INDEX</text>
      <rect x="0" y="16" width="360" height="4" fill="#25243a"/>
      <rect x="0" y="16" width="18" height="4" fill="#f76a4a"/>
      <text y="42" font-size="14" fill="#f76a4a">0.05 · NON-HABITABLE</text>
    </g>
  </g>

  <!-- Left rail -->
  <g font-family="'JetBrains Mono', 'Menlo', monospace" font-size="14" fill="#c8ccff" opacity="0.75">
    <text x="80" y="70" opacity="0.55">SYSTEM</text>
    <circle cx="60" cy="66" r="3" fill="#818cf8"/>
    <text x="80" y="70" fill="#e8e8f0">PLANET DETAIL</text>
    <text x="180" y="70" opacity="0.4">CLASSIFY</text>
    <text x="280" y="70" opacity="0.4">GENERATE</text>
    <text x="380" y="70" opacity="0.4">TIMELINE</text>
  </g>
</svg>
